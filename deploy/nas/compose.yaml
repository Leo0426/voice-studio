services:
  app:
    image: voice-studio-nas:${VOICE_STUDIO_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4317"
      VOICE_STUDIO_ORIGIN: https://${VOICE_STUDIO_HOST:?}:${VOICE_STUDIO_PORT:-14443}
      VOICE_STUDIO_AUTH_DB: /data/access.sqlite
      VOICE_STUDIO_OPENAI_CONFIG: /data/openai.env
    volumes:
      - ${VOICE_STUDIO_DATA:?}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:4317/api/health',{headers:{Host:new URL(process.env.VOICE_STUDIO_ORIGIN).host}},r=>{r.resume();if(r.statusCode!==200)process.exitCode=1}).on('error',()=>{process.exitCode=1})"]
      interval: 15s
      timeout: 3s
      retries: 4
    security_opt: [no-new-privileges:true]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VOICE_STUDIO_HOST: ${VOICE_STUDIO_HOST:?}
    ports:
      - "${VOICE_STUDIO_BIND_IP:?}:${VOICE_STUDIO_PORT:-14443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VOICE_STUDIO_TLS_DIR:?}:/certs:ro
    security_opt: [no-new-privileges:true]
