# 发行说明 PR 可下载预览包。推送 v* 标签时自动构建并创建 GitHub Release。
# 构建链接 MLX，必须走 xcodebuild（Metal shaders，见 CLAUDE.md）。
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths: ["docs/release-notes/v*.md"]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 打包脚本用提交计数生成 CFBundleVersion
          persist-credentials: false

      # mlx-audio-swift 要求 swift-tools 6.2（Xcode 26），runner 默认 Xcode 版本不够
      - name: 选择 Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "未找到 Xcode 26，镜像可用版本："
            ls /Applications | grep -i xcode
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          swift --version

      - name: 确认 Metal 工具链
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - name: 缓存 SPM 依赖
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: arm64

      - name: 构建并打包
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION=0.0.0
          fi
          scripts/package-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-arm64
          path: |
            dist/VoiceStudio-*.zip
            dist/VoiceStudio-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: VoiceStudio-arm64
          path: dist
      - name: 校验安装包
        run: |
          cd dist
          sha256sum --check "VoiceStudio-${GITHUB_REF_NAME}-arm64.zip.sha256"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" dist/VoiceStudio-*.zip dist/VoiceStudio-*.zip.sha256 \
              --verify-tag --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/VoiceStudio-*.zip dist/VoiceStudio-*.zip.sha256 \
              --verify-tag --title "$TAG" --generate-notes
          fi
